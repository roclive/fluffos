<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pi / MUD 自动化监视器</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d0c; --ink:#ecefe9; --muted:#858b84; --line:#292d29; --accent:#b8f34a; --danger:#ff735c; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.16; background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px); background-size:32px 32px; }
    main { position:relative; width:min(1180px,calc(100% - 40px)); margin:auto; padding:36px 0 56px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:28px; animation:arrive .45s ease both; }
    .eyebrow,.label { color:var(--muted); font-size:11px; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:6px 0 0; font:600 clamp(28px,5vw,58px)/1 system-ui,sans-serif; letter-spacing:-.045em; }
    .connection { display:flex; align-items:center; gap:10px; color:var(--muted); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--danger); transition:.2s; }
    .connected .dot { background:var(--accent); box-shadow:0 0 18px var(--accent); }
    .workspace { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr); gap:46px; padding-top:42px; }
    .primary { min-width:0; }
    .state-line { display:flex; align-items:baseline; gap:20px; margin-bottom:50px; }
    #status { font:600 clamp(45px,8vw,104px)/.85 system-ui,sans-serif; letter-spacing:-.06em; text-transform:uppercase; transition:color .2s,transform .2s; }
    #status.pulse { transform:translateX(6px); color:var(--accent); }
    .count { color:var(--accent); font-size:20px; }
    .route { display:grid; grid-template-columns:1fr 38px 1fr; align-items:end; padding:22px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .route strong { display:block; margin-top:7px; font:500 22px/1.2 system-ui,sans-serif; overflow-wrap:anywhere; }
    .arrow { color:var(--accent); text-align:center; }
    .decision { margin-top:34px; max-width:720px; }
    .decision p { margin:8px 0 0; font:400 clamp(20px,3vw,34px)/1.25 system-ui,sans-serif; letter-spacing:-.025em; }
    .confidence { margin-top:24px; height:2px; background:var(--line); }
    .confidence i { display:block; height:100%; width:0; background:var(--accent); transition:width .45s cubic-bezier(.2,.8,.2,1); }
    aside { border-left:1px solid var(--line); padding-left:34px; }
    dl { margin:0; }
    .metric { padding:0 0 24px; margin-bottom:24px; border-bottom:1px solid var(--line); }
    dt { color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    dd { margin:8px 0 0; font:500 19px/1.3 system-ui,sans-serif; overflow-wrap:anywhere; }
    .confirmation { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .confirmation .metric { margin:0; }
    .ok { color:var(--accent); } .bad { color:var(--danger); }
    .controls { display:flex; gap:8px; margin-top:34px; }
    button { flex:1; border:1px solid var(--line); background:transparent; color:var(--ink); padding:12px 6px; font:inherit; cursor:pointer; transition:.16s; }
    button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }
    button:disabled { opacity:.35; cursor:not-allowed; }
    .cancel:hover:not(:disabled) { border-color:var(--danger); color:var(--danger); }
    .foot { margin-top:28px; color:var(--muted); font-size:11px; }
    @keyframes arrive { from { opacity:0; transform:translateY(-10px) } }
    @media (max-width:760px) { main{width:min(100% - 26px,1180px);padding-top:22px}.workspace{grid-template-columns:1fr;gap:38px}.state-line{margin-bottom:32px}aside{border-left:0;border-top:1px solid var(--line);padding:30px 0 0}.connection span:last-child{display:none} }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important } }
  </style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">Pi × FluffOS / control plane</div><h1>自动化轨迹</h1></div>
    <div id="connection" class="connection"><i class="dot"></i><span id="connectionText">未连接</span></div>
  </header>
  <section class="workspace">
    <div class="primary">
      <div class="state-line"><span id="status">IDLE</span><span class="count"><b id="modelCalls">0</b> MODEL CALLS</span></div>
      <div class="route">
        <div><span class="label">Current skill</span><strong id="skill">—</strong></div><span class="arrow">→</span>
        <div><span class="label">Current route</span><strong id="route">—</strong></div>
      </div>
      <div class="decision"><span class="label">Decision reason · <b id="trigger">—</b></span><p id="reason">等待 Pi 决策事件。</p><div class="confidence"><i id="confidence"></i></div></div>
    </div>
    <aside>
      <dl>
        <div class="metric"><dt>Step</dt><dd><span id="step">0</span> / <span id="total">0</span> · <span id="command">—</span></dd></div>
        <div class="confirmation">
          <div class="metric"><dt>Expected room</dt><dd id="expectedRoom">—</dd></div>
          <div class="metric"><dt>Actual room</dt><dd id="actualRoom">—</dd></div>
        </div>
        <div class="metric" style="margin-top:24px"><dt>Confirmation</dt><dd id="confirmed">PENDING</dd></div>
      </dl>
      <div class="controls"><button data-action="pause">暂停</button><button data-action="resume">继续</button><button class="cancel" data-action="cancel">取消</button></div>
      <div class="foot">仅接受本机会话绑定的 schema v1 控制事件。页面不发送游戏命令，也不登录真实账号。</div>
    </aside>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  let socket, sessionId = '', sequence = 0;
  const controls = [...document.querySelectorAll('button[data-action]')];
  function connect() {
    const url = new URL(location.href).searchParams.get('ws') || 'ws://127.0.0.1:8081';
    socket = new WebSocket(url);
    socket.onopen = () => { $('connection').classList.add('connected'); $('connectionText').textContent = 'LIVE · ' + url; };
    socket.onclose = () => { $('connection').classList.remove('connected'); $('connectionText').textContent = '重连中'; controls.forEach(b => b.disabled = true); setTimeout(connect, 1500); };
    socket.onmessage = event => { try { const message=JSON.parse(event.data); if(message.type==='automation_state') render(message.data); } catch {} };
  }
  function render(data) {
    sessionId=data.sessionId || ''; sequence=Math.max(sequence,data.control?.lastSequence || 0);
    controls.forEach(b => b.disabled=!sessionId);
    const status=$('status'); status.textContent=(data.status || 'idle').toUpperCase(); status.classList.remove('pulse'); requestAnimationFrame(()=>status.classList.add('pulse'));
    $('modelCalls').textContent=data.modelCalls ?? 0; $('skill').textContent=data.currentSkill || '—'; $('route').textContent=data.currentRoute || '—';
    $('reason').textContent=data.decision?.reason || '等待 Pi 决策事件。'; $('trigger').textContent=data.decision?.trigger || '—'; $('confidence').style.width=((data.decision?.confidence || 0)*100)+'%';
    const c=data.confirmation || {}; for(const key of ['step','total','command','expectedRoom','actualRoom']) $(key).textContent=c[key] || (key==='step'||key==='total' ? '0':'—');
    $('confirmed').textContent=c.confirmed===true?'CONFIRMED':c.confirmed===false?'MISMATCH':'PENDING'; $('confirmed').className=c.confirmed===true?'ok':c.confirmed===false?'bad':'';
  }
  controls.forEach(button => button.onclick = () => {
    if(!socket || socket.readyState!==WebSocket.OPEN || !sessionId) return;
    socket.send(JSON.stringify({type:'automation_control',version:1,sessionId,source:'web-client',sequence:++sequence,action:button.dataset.action}));
  });
  connect();
</script>
</body>
</html>
